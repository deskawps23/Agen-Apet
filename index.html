<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agen Apeet Pandeglang</title>
</head>
<body>
  <h1>🚀 Firebase Web App Connected</h1>
  <p>Project: agen-apeet-pandeglang</p>

  <!-- Firebase SDK -->
  <script type="module">
    // Import Firebase App
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadString, getDownloadURL } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyA2L1XVgXuoXA27o6QrcAzriRV-Ydprid4",
      authDomain: "agen-apeet-pandeglang.firebaseapp.com",
      projectId: "agen-apeet-pandeglang",
      storageBucket: "agen-apeet-pandeglang.firebasestorage.app",
      messagingSenderId: "531140473833",
      appId: "1:531140473833:web:49ce2afd98208619d89178"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    console.log("Firebase initialized:", app);

    // 🔐 Contoh Auth: Register & Login
    async function registerUser(email, password) {
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        console.log("User registered:", userCredential.user);
      } catch (error) {
        console.error("Error registering:", error);
      }
    }

    async function loginUser(email, password) {
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        console.log("User logged in:", userCredential.user);
      } catch (error) {
        console.error("Error logging in:", error);
      }
    }

    // 📦 Contoh Firestore: Simpan & Ambil Data
    async function saveData(uid, data) {
      await setDoc(doc(db, "users", uid), data);
      console.log("Data saved for:", uid);
    }

    async function getData(uid) {
      const docSnap = await getDoc(doc(db, "users", uid));
      if (docSnap.exists()) {
        console.log("Data:", docSnap.data());
      } else {
        console.log("No data found");
      }
    }

    // 🗂️ Contoh Storage: Upload & Ambil File
    async function uploadFile(uid, content) {
      const storageRef = ref(storage, `files/${uid}.txt`);
      await uploadString(storageRef, content);
      const url = await getDownloadURL(storageRef);
      console.log("File uploaded, URL:", url);
    }

    // 🚀 Uji coba cepat
    registerUser("test@example.com", "password123");
    loginUser("test@example.com", "password123");
    saveData("testUID", { name: "Deska", role: "Admin" });
    getData("testUID");
    uploadFile("testUID", "Hello Firebase Storage!");
  </script>
</body>
</html>
